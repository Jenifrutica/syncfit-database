services:
  db:
    image: postgres:16-alpine
    container_name: syncfit-postgres
    environment:
      POSTGRES_USER: syncfit
      POSTGRES_PASSWORD: syncfit
      POSTGRES_DB: syncfit
    ports:
      - "5432:5432"
    volumes:
      - syncfit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncfit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncfit_pgdata:
